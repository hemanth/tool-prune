[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-prune"
version = "0.1.0"
description = "Fast, calibrated tool selection and schema pruning for AI agents using TypeSafe System One."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Hemanth HM", email = "hemanth.hm@gmail.com" },
]
keywords = ["tool-prune", "tool-selection", "mcp", "agents", "typesafe", "routing", "function-calling", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/hemanth/tool-prune"
Repository = "https://github.com/hemanth/tool-prune"
